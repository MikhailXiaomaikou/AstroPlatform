name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    # Backstop against a hung test: pytest-timeout enforces the per-test
    # @pytest.mark.timeout marks, but unmarked tests can still deadlock, and
    # without this the job would burn the 360-minute GitHub default. Normal
    # runs take ~35 minutes.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          cd backend
          pip install --require-hashes -r requirements.lock
      - name: Run tests with coverage (cosmology + shared infra)
        # cosmology-only repo: solar_system / exoplanet / dormant modules and
        # their tests were extracted to the standard-astro-verticals repo, so
        # the whole suite is cosmology + shared/core infrastructure.
        run: |
          cd backend
          pip install pytest-cov==5.0.0 pytest-timeout==2.4.0
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Type check
        run: |
          cd frontend
          npx tsc -b --noEmit
      - name: Lint
        run: |
          cd frontend
          npm run lint
      - name: Run tests
        run: |
          cd frontend
          npx vitest run
      - name: Build
        # CLAUDE.md: "npm run build is the final frontend gate" — the vite
        # build half (rollup resolution, manualChunks, assets) is not covered
        # by tsc/vitest, so build-only breakage must fail here, not at deploy.
        run: |
          cd frontend
          npm run build

  frontend-e2e:
    needs: frontend-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run isolated browser journeys
        run: cd frontend && npm run test:e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install ruff
        # Pinned to the backend venv's version so the edit-time hook
        # (.claude/hooks/ruff-check.py) and this gate report identically.
        run: pip install ruff==0.15.13
      - name: Lint backend
        run: cd backend && ruff check app/ --select E,W,F --ignore E501

  container-build:
    # Render deploys the backend, worker and beat from backend/Dockerfile. A
    # source-only test pass must not be allowed to hide a broken production
    # image (apt packages, COPY paths, locked wheels, or non-root ownership).
    needs: [lint, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build backend production image
        run: docker build --pull -t standard-astro-backend:ci backend
      - name: Build frontend image
        run: >-
          docker build --pull
          --build-arg VITE_API_URL=http://localhost:8000
          -t standard-astro-frontend:ci frontend

  migration-and-recovery:
    # Production uses Alembic exclusively. Exercise a genuinely empty
    # PostgreSQL database, reject model/migration drift, then prove that the
    # portable backup can be restored into a second empty database.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: astro
          POSTGRES_DB: astro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astro -d astro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://astro:astro@127.0.0.1:5432/astro
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      FERNET_KEY: ci-only-fernet-secret-not-for-production
      EVIDENCE_SIGNING_KEY: ci-only-evidence-secret-not-for-production
      EVIDENCE_SIGNING_KEY_ID: ci-evidence-v1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install backend and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          cd backend
          pip install --require-hashes -r requirements.lock
      - name: Upgrade a fresh PostgreSQL database to Alembic head
        run: |
          cd backend
          alembic upgrade head
          alembic check
          python - <<'PY'
          import asyncio
          from app.api.health import _probe_schema_head

          assert asyncio.run(_probe_schema_head()) == (True, "ok")
          PY
      - name: Exercise legacy VARCHAR UUID migration and dirty-data rollback
        env:
          PGPASSWORD: astro
          UUID_DRILL_DATABASE_URL: postgresql+asyncpg://astro:astro@127.0.0.1:5432/astro_uuid_drill_ci
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U astro astro_uuid_drill_ci
          trap 'dropdb -h 127.0.0.1 -U astro --if-exists astro_uuid_drill_ci' EXIT
          DATABASE_URL="$UUID_DRILL_DATABASE_URL" \
            PYTHON=python \
            backend/scripts/ops/run_legacy_uuid_migration_drill.sh
      - name: Backup and restore smoke test
        env:
          PGPASSWORD: astro
        run: |
          mkdir -p /tmp/astro-storage
          printf 'recovery-smoke\n' >/tmp/astro-storage/sentinel.txt
          bundle="$(BACKUP_ROOT=/tmp/astro-backups STORAGE_DIR=/tmp/astro-storage FERNET_KEY_ID=ci-test-key backend/scripts/ops/backup.sh)"
          backup_id="$(basename "$bundle" .tar.gz)"
          createdb -h 127.0.0.1 -U astro astro_restore
          DATABASE_URL=postgresql://astro:astro@127.0.0.1:5432/astro_restore \
            RESTORE_CONFIRM="restore:$backup_id" \
            RESTORE_STORAGE_DIR=/tmp/astro-restored-storage \
            backend/scripts/ops/restore.sh "$bundle"
          test -f /tmp/astro-restored-storage/sentinel.txt
          test "$(psql postgresql://astro:astro@127.0.0.1:5432/astro_restore -Atc 'select count(*) from alembic_version')" = "1"

  benchmarks:
    # Science-regression smoke (cosmology benchmarks + registry audit).
    # This is PR-gating: scientific regressions must be caught before merge.
    # Explicit slow-path skips remain visible as skips in the JSON summary and
    # are not miscounted as passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          cd backend
          pip install --require-hashes -r requirements.lock
      - name: Cosmology benchmarks
        run: |
          cd backend
          python scripts/benchmarks/run_cosmology_benchmarks.py --json /tmp/cosmology_benchmarks.json
      - name: Cosmology registry audit
        run: |
          cd backend
          python scripts/audit_registry.py --json /tmp/registry_audit.json
      - name: Upload benchmark JSON artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            /tmp/cosmology_benchmarks.json
            /tmp/registry_audit.json
          if-no-files-found: ignore
