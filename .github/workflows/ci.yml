name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    # Backstop against a hung test: pytest-timeout enforces the per-test
    # @pytest.mark.timeout marks, but unmarked tests can still deadlock, and
    # without this the job would burn the 360-minute GitHub default. Full
    # hosted runs can exceed 50 minutes as the scientific suite grows.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          cd backend
          pip install --require-hashes -r requirements.lock
      - name: Fetch pinned Pantheon+ adequacy inputs
        shell: bash
        run: |
          set -euo pipefail
          hydrate_sparse_checkout() {
            local root="$1" repository="$2" commit="$3" sparse_path="$4"
            mkdir -p "$root"
            git -C "$root" init --quiet
            git -C "$root" remote add origin "$repository"
            git -C "$root" sparse-checkout init --no-cone
            git -C "$root" sparse-checkout set --no-cone "$sparse_path"
            git -C "$root" fetch --quiet --depth=1 --filter=blob:none origin "$commit"
            git -C "$root" checkout --quiet --detach FETCH_HEAD
            test "$(git -C "$root" rev-parse HEAD)" = "$commit"
          }
          sn_root='.local/w0wa-strict-a-readiness/sn-data-v1.8'
          sn_path='PantheonPlus/Pantheon+SH0ES.dat'
          hydrate_sparse_checkout \
            "$sn_root" 'https://github.com/CobayaSampler/sn_data.git' \
            '61d96434cafc2770928322c38e5a750e686368ae' "$sn_path"
          table='backend/packages/data/sn_data/PantheonPlus/Pantheon+SH0ES.dat'
          mkdir -p "$(dirname "$table")"
          cp "$sn_root/$sn_path" "$table"
          release_root='.local/w0wa-strict-a-readiness/pantheonplus-data-release'
          covariance_path='Pantheon+_Data/4_DISTANCES_AND_COVAR/Pantheon+SH0ES_STATONLY.cov'
          hydrate_sparse_checkout \
            "$release_root" 'https://github.com/PantheonPlusSH0ES/DataRelease.git' \
            'c447f0fea703fcd0fff57de5000947b5ca81286b' "$covariance_path"
          covariance="$release_root/$covariance_path"
          printf '%s  %s\n' \
            '1cb0fc379ef066afdc2ffd1857681cc478024570d8a3eba284fb645775198cf8' \
            "$table" | sha256sum --check --strict
          printf '%s  %s\n' \
            '9f177129a332735d3637affd20054080d5260815f3ca0809120c05b2c902297f' \
            "$covariance" | sha256sum --check --strict
      - name: Run tests with coverage (cosmology + shared infra)
        # cosmology-only repo: solar_system / exoplanet / dormant modules and
        # their tests were extracted to the standard-astro-verticals repo, so
        # the whole suite is cosmology + shared/core infrastructure.
        run: |
          cd backend
          pip install pytest-cov==5.0.0 pytest-timeout==2.4.0
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Type check
        run: |
          cd frontend
          npx tsc -b --noEmit
      - name: Lint
        run: |
          cd frontend
          npm run lint
      - name: Run tests
        run: |
          cd frontend
          npx vitest run
      - name: Build
        # CLAUDE.md: "npm run build is the final frontend gate" — the vite
        # build half (rollup resolution, manualChunks, assets) is not covered
        # by tsc/vitest, so build-only breakage must fail here, not at deploy.
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: http://localhost:8000

  frontend-e2e:
    needs: frontend-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Install Playwright Chromium
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run isolated browser journeys
        run: cd frontend && npm run test:e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Install ruff
        # Pinned to the backend venv's version so the edit-time hook
        # (.claude/hooks/ruff-check.py) and this gate report identically.
        run: pip install ruff==0.15.13
      - name: Lint backend
        run: cd backend && ruff check app/ --select E,W,F --ignore E501

  container-build:
    # Render deploys the backend, worker and beat from backend/Dockerfile. A
    # source-only test pass must not be allowed to hide a broken production
    # image (apt packages, COPY paths, locked wheels, or non-root ownership).
    needs: [lint, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build backend production image
        run: >-
          docker build --pull
          --build-arg TOOL_VERSION="$GITHUB_SHA"
          -t standard-astro-backend:ci backend
      - name: Build local science Worker image
        run: >-
          docker build --pull
          --build-arg TOOL_VERSION="$GITHUB_SHA"
          --file backend/Dockerfile.worker
          -t standard-astro-science-worker:ci backend
      - name: Build isolated Foundry Demo image
        run: >-
          docker build --pull
          --build-arg TOOL_VERSION="$GITHUB_SHA"
          --file backend/Dockerfile.foundry-demo
          -t standard-astro-foundry-demo:ci backend
      - name: Build frontend image
        run: >-
          docker build --pull
          --build-arg VITE_API_URL=http://localhost:8000
          -t standard-astro-frontend:ci frontend

  migration-and-recovery:
    # Production uses Alembic exclusively. Exercise a genuinely empty
    # PostgreSQL database, reject model/migration drift, then prove that the
    # portable backup can be restored into a second empty database.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astro
          POSTGRES_PASSWORD: astro
          POSTGRES_DB: astro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astro -d astro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENV: production
      APP_ROLE: migration
      SCIENCE_EXECUTION_BACKEND: celery
      TOOL_VERSION: ${{ github.sha }}
      DATABASE_URL: postgresql+asyncpg://astro:astro@127.0.0.1:5432/astro
      EVIDENCE_SIGNING_KEY_ID: ci-evidence-v1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install backend and PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          cd backend
          pip install --require-hashes -r requirements.lock
      - name: Upgrade a fresh PostgreSQL database to Alembic head
        run: |
          cd backend
          alembic upgrade head
          alembic check
          python - <<'PY'
          import asyncio
          from app.api.health import _probe_schema_head

          assert asyncio.run(_probe_schema_head()) == (True, "ok")
          PY
      - name: Exercise legacy VARCHAR UUID migration and dirty-data rollback
        env:
          PGPASSWORD: astro
          UUID_DRILL_DATABASE_URL: postgresql+asyncpg://astro:astro@127.0.0.1:5432/astro_uuid_drill_ci
        run: |
          set -euo pipefail
          createdb -h 127.0.0.1 -U astro astro_uuid_drill_ci
          trap 'dropdb -h 127.0.0.1 -U astro --if-exists astro_uuid_drill_ci' EXIT
          DATABASE_URL="$UUID_DRILL_DATABASE_URL" \
            PYTHON=python \
            backend/scripts/ops/run_legacy_uuid_migration_drill.sh
      - name: Backup and restore smoke test
        env:
          PGPASSWORD: astro
        run: |
          mkdir -p /tmp/astro-storage
          printf 'recovery-smoke\n' >/tmp/astro-storage/sentinel.txt
          bundle="$(BACKUP_ROOT=/tmp/astro-backups STORAGE_DIR=/tmp/astro-storage FERNET_KEY_ID=ci-test-key backend/scripts/ops/backup.sh)"
          backup_id="$(basename "$bundle" .tar.gz)"
          createdb -h 127.0.0.1 -U astro astro_restore
          DATABASE_URL=postgresql://astro:astro@127.0.0.1:5432/astro_restore \
            RESTORE_CONFIRM="restore:$backup_id" \
            RESTORE_EXPECTED_COMMIT="$GITHUB_SHA" \
            RESTORE_FERNET_KEY_ID=ci-test-key \
            RESTORE_EVIDENCE_SIGNING_KEY_ID="$EVIDENCE_SIGNING_KEY_ID" \
            RESTORE_STORAGE_DIR=/tmp/astro-restored-storage \
            backend/scripts/ops/restore.sh "$bundle"
          test -f /tmp/astro-restored-storage/sentinel.txt
          test "$(psql postgresql://astro:astro@127.0.0.1:5432/astro_restore -Atc 'select count(*) from alembic_version')" = "1"

  benchmarks:
    # Science-regression smoke (cosmology benchmarks + registry audit).
    # This is PR-gating: scientific regressions must be caught before merge.
    # Explicit slow-path skips remain visible as skips in the JSON summary and
    # are not miscounted as passes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements.lock
      - name: Install dependencies
        run: |
          cd backend
          pip install --require-hashes -r requirements.lock
      - name: Cosmology benchmarks
        run: |
          cd backend
          python scripts/benchmarks/run_cosmology_benchmarks.py --json /tmp/cosmology_benchmarks.json
      - name: Cosmology registry audit
        run: |
          cd backend
          python scripts/audit_registry.py --json /tmp/registry_audit.json
      - name: Upload benchmark JSON artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            /tmp/cosmology_benchmarks.json
            /tmp/registry_audit.json
          if-no-files-found: ignore
