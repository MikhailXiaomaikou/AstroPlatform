name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests with coverage (cosmology + shared infra)
        # cosmology-only repo: solar_system / exoplanet / dormant modules and
        # their tests were extracted to the standard-astro-verticals repo, so
        # the whole suite is cosmology + shared/core infrastructure.
        run: |
          cd backend
          pip install pytest-cov
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Run tests
        run: |
          cd frontend
          npx vitest run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint backend
        run: cd backend && ruff check app/ --select E,W,F --ignore E501

  benchmarks:
    # Science-regression smoke (cosmology benchmarks + registry audit).
    # Push-only so a benchmark regression on main is loud, but PRs are NOT
    # gated on it — keeps PR review velocity, surfaces regressions
    # immediately after merge for follow-up.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Cosmology benchmarks
        run: |
          cd backend
          python scripts/benchmarks/run_cosmology_benchmarks.py --json /tmp/cosmology_benchmarks.json
      - name: Cosmology registry audit
        run: |
          cd backend
          python scripts/audit_registry.py --json /tmp/registry_audit.json
      - name: Upload benchmark JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            /tmp/cosmology_benchmarks.json
            /tmp/registry_audit.json
          if-no-files-found: ignore
