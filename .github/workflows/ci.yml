name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Run tests with coverage (cosmology + shared infra)
        # Scoped to the active cosmology module + shared/core infrastructure.
        # The exoplanet vertical tests were deleted (dormant module); the
        # dormant solar_system vertical-specific DOMAIN tests are excluded here
        # — every shared test (incl. test_claim_validator_solar_system /
        # test_astro_* which exercise core infra via vertical fixtures) is kept.
        # The exclusion list was produced by classifying all test files and
        # adversarially verifying each exclusion cannot drop cosmology or shared
        # coverage. Measured coverage: 59% (gate is 45%), 2344 passed.
        run: |
          cd backend
          pip install pytest-cov
          python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing \
            --ignore=tests/test_ai_tools_solar_system.py \
            --ignore=tests/test_carvano_calibration.py \
            --ignore=tests/test_jpl_connector.py \
            --ignore=tests/test_mpc_connector.py \
            --ignore=tests/test_solar_system_dynamics.py \
            --ignore=tests/test_solar_system_integration.py \
            --ignore=tests/test_solar_system_phot.py \
            --ignore=tests/test_solar_system_taxonomy.py \
            --ignore=tests/test_solar_system_thermo.py

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Type check
        run: |
          cd frontend
          npx tsc --noEmit
      - name: Run tests
        run: |
          cd frontend
          npx vitest run

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint backend
        run: cd backend && ruff check app/ --select E,W,F --ignore E501

  benchmarks:
    # Science-regression smoke (cosmology benchmarks + registry audit).
    # Push-only so a benchmark regression on main is loud, but PRs are NOT
    # gated on it — keeps PR review velocity, surfaces regressions
    # immediately after merge for follow-up.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
      - name: Cosmology benchmarks
        run: |
          cd backend
          python scripts/benchmarks/run_cosmology_benchmarks.py --json /tmp/cosmology_benchmarks.json
      - name: Solar-system benchmarks
        run: |
          cd backend
          python scripts/benchmarks/run_solar_system_benchmarks.py --json /tmp/solar_system_benchmarks.json
      - name: Cosmology registry audit
        run: |
          cd backend
          python scripts/audit_registry.py --json /tmp/registry_audit.json
      - name: Upload benchmark JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: |
            /tmp/cosmology_benchmarks.json
            /tmp/solar_system_benchmarks.json
            /tmp/registry_audit.json
          if-no-files-found: ignore
