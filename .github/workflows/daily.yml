name: Daily

# Daily blind tests + integration tests. NOT part of the per-PR gate
# (those live in ci.yml). Triggers at 16:00 UTC (~00:00 Beijing) and
# can be manually fired via workflow_dispatch.
#
# Requirements (set in repo Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY   — for the blind-test LLM calls (any provider key
#                          recognized by app.ai.inference_router will work;
#                          this is just the default)
#
# If no secret is configured the blind-test job is skipped (the if-guard
# below) but integration tests still run. That keeps the daily cron from
# spuriously red-X-ing the repo health badge while keys are being set up.

on:
  schedule:
    - cron: "17 16 * * *"     # 16:17 UTC daily (off the top-of-hour: GitHub silently drops congested whole-hour crons — 2026-06-11's run was skipped, and actual starts had drifted to +2.4h)
  workflow_dispatch:           # manual button in the Actions UI
    inputs:
      module:
        description: "Module to run. cosmology is the only active module in this repo."
        required: false
        default: "cosmology"
        type: choice
        options:
          - cosmology
      cases:
        description: "Comma-separated case IDs to run (e.g. A2,A3). Empty = all cases in the module(s). Tight iteration loops use this to shrink a 20-min run to 1-2 cases × ~2 min each."
        required: false
        default: ""
        type: string
      provider:
        description: "LLM provider for the runner. 'auto' picks deepseek when only DEEPSEEK_API_KEY is set (the cheap daily-cron path), otherwise lets the runner default to anthropic."
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - anthropic
          - deepseek
      model:
        description: "Claude model id when provider=anthropic (claude-opus-4-7 or claude-sonnet-4-6). Ignored when provider=deepseek or auto-picked deepseek."
        required: false
        default: "claude-sonnet-4-6"
        type: choice
        options:
          - claude-sonnet-4-6
          - claude-opus-4-7

jobs:
  blind-tests:
    runs-on: ubuntu-latest
    # GitHub Actions does NOT allow the `secrets` context in a job-level
    # `if:` (only in step `if:` and `env:`), so the activation gate is the
    # vars.DAILY_BLIND_ENABLED flag alone. If the user opts in via that
    # variable but forgot to set the API-key secret, the runner aborts
    # cleanly on missing-key — daily_blind.sh + runner.py both check.
    if: ${{ vars.DAILY_BLIND_ENABLED == 'true' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          python -m venv venv
          ./venv/bin/pip install -r requirements.txt
      - name: Run blind tests (cosmology)
        env:
          # Map PLATFORM_DEEPSEEK_API_KEY (platform-default secret name)
          # onto the DEEPSEEK_API_KEY env var the runner actually reads,
          # so a single PLATFORM_DEEPSEEK_API_KEY secret is enough to
          # activate the deepseek path.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.PLATFORM_DEEPSEEK_API_KEY }}
          # cosmology is the only active module; the cron has no inputs, so the
          # `|| 'cosmology'` fallback applies. daily_blind.sh honors --module.
          BLIND_MODULE: ${{ inputs.module || 'cosmology' }}
          BLIND_CASES: ${{ inputs.cases || '' }}
          BLIND_PROVIDER: ${{ inputs.provider || 'auto' }}
          # CLAUDE_MODEL is read directly by app.ai.model_profiles when
          # provider=anthropic; ignored otherwise.
          CLAUDE_MODEL: ${{ inputs.model || 'claude-sonnet-4-6' }}
        run: |
          set -- --module "$BLIND_MODULE"
          if [[ -n "$BLIND_CASES" ]]; then
            set -- "$@" --case "$BLIND_CASES"
          fi
          if [[ "$BLIND_PROVIDER" != "auto" ]]; then
            set -- "$@" --provider "$BLIND_PROVIDER"
          fi
          bash backend/scripts/daily_blind.sh "$@"
      - name: Upload blind-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-tests-${{ github.run_id }}
          path: |
            backend/scripts/blind_test_cosmology_m0/results_*
          if-no-files-found: ignore

  integration:
    # Integration tests are the pytest cases marked `integration and not slow`
    # (~44 cases): tests/test_e2e_full.py end-to-end execute_tool() coverage
    # (data-query / science / sandbox / literature+export / spectrum-image-VO /
    # pipeline / session / collaboration tools) plus three live-connector
    # checks in tests/test_connectors.py (SIMBAD, SDSS, Gaia). Many are
    # @pytest.mark.network and hit live archive TAP services, so an upstream
    # outage (e.g. SIMBAD 503) can redden this job without any code
    # regression. Pure pytest, no LLM key needed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Run integration tests
        run: |
          cd backend
          # Disable coverage gate: integration is a small slice (~44 cases) so
          # its coverage (~19%) trivially fails pytest.ini's 45% threshold,
          # which is calibrated for the unit-test suite in backend-test.
          python -m pytest tests/ -v --tb=short -m "integration and not slow" --no-cov
      - name: Audit citation-pool reachability
        # 2026-06-13 (P3b): audit_registry runs per-PR, but the citation-pool
        # reachability audit (the SPECIFICITY side that guards against
        # anchor-gate false kills of the 9f2667e class) never ran on a
        # schedule — this campaign alone pinned 20+ new citations that had
        # never passed an automated reachability check. Daily cadence here;
        # a regression turns the Daily badge red without gating PRs.
        run: |
          cd backend
          python scripts/audit_citation_pool.py
