name: Non-formal Foundry candidate demo

on:
  workflow_dispatch:
    inputs:
      candidate_key:
        description: Repository-pinned candidate key (without .json)
        required: true
        default: desi_dr2_official_chain_summary_v1
        type: string
      validation_run_id:
        description: Durable Foundry validation-run UUID to receive this DemoReport
        required: false
        type: string

permissions:
  contents: read

jobs:
  isolated-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate candidate key
        env:
          CANDIDATE: ${{ inputs.candidate_key }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" =~ ^[a-z][a-z0-9_]{2,96}$ ]]
          if [[ -n "$VALIDATION_RUN_ID" ]]; then
            [[ "$VALIDATION_RUN_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          fi
          test -f "backend/foundry_candidates/$CANDIDATE.json"

      - name: Build no-secrets candidate runner
        run: >-
          docker build --pull
          --build-arg TOOL_VERSION="$GITHUB_SHA"
          --file backend/Dockerfile.foundry-demo
          --tag standard-astro-foundry-demo:ci
          backend

      - name: Run candidate without network, secrets, or writable root
        env:
          CANDIDATE: ${{ inputs.candidate_key }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p foundry-output
          chmod 0777 foundry-output
          runner_digest="$(docker image inspect --format '{{.Id}}' standard-astro-foundry-demo:ci)"
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=67108864 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --cpus 2 \
            --memory 6g \
            --user 10002:10002 \
            --volume "$PWD/foundry-output:/out:rw" \
            standard-astro-foundry-demo:ci \
            --candidate "$CANDIDATE" \
            --output /out/demo-report.json \
            --runner-image-digest "$runner_digest"

      - name: Enforce the non-formal report contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("foundry-output/demo-report.json").read_text())
          assert report["status"] in {"PASSED", "PARTIAL", "FAILED"}
          assert report["evidence_class"] == "NON_FORMAL_DEMO"
          assert report["publication_ready"] is False
          assert report["claim_eligible"] is False
          assert report["evidence_pack_allowed"] is False
          assert report.get("scientific_verdict") != "SUPPORTED"
          assert len(report["candidate_bundle_sha256"]) == 64
          assert len(report["demo_report_sha256"]) == 64
          PY

      # The untrusted candidate container has already exited. Only this host
      # step sees the narrowly scoped ingestion credential; candidate code had
      # no network and never received it. Manual smoke runs may omit a durable
      # validation id and intentionally skip ingestion.
      - name: Append DemoReport to the durable Candidate ledger
        if: ${{ inputs.validation_run_id != '' }}
        env:
          CALLBACK_URL: ${{ secrets.FOUNDRY_VALIDATION_CALLBACK_URL }}
          RESULT_SECRET: ${{ secrets.FOUNDRY_VALIDATION_RESULT_SECRET }}
          VALIDATION_RUN_ID: ${{ inputs.validation_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CALLBACK_URL"
          test -n "$RESULT_SECRET"
          callback="${CALLBACK_URL%/}/api/internal/foundry/validation-runs/${VALIDATION_RUN_ID}/demo-report"
          curl --fail-with-body --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 60 \
            -H "Authorization: Bearer $RESULT_SECRET" \
            -H "Content-Type: application/json" \
            --data-binary @foundry-output/demo-report.json \
            "$callback"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: foundry-demo-${{ inputs.candidate_key }}-${{ github.sha }}
          path: foundry-output/demo-report.json
          if-no-files-found: error
          retention-days: 30
