# Solar System Objects module manifest
# Status: active (activated in M0 Commit 1, 2026-05-18 — moved from _dormant_solar_system).
# Loaded when ASTRO_RESEARCH_FOCUS=solar_system.
name: solar_system
display: Solar System Objects (asteroids / comets / TNOs)
status: active
prompt_file: prompt.md
tools:
  # M0 Commit 4 (2026-05-18): 12 solar-system-specific tools (mined from papers + implemented).
  # Grouped as: data query (6) + formula computation (4) + classification (2).
  # References for each tool live in the matching schema description and the
  # services/solar_system_*.py docstrings.
  # -- data query --
  - query_mpc_orbit              # IAU MPC orbit DB
  - fetch_horizons_ephemeris     # Giorgini+1996 (1996DPS....28.2504G)
  - query_sbdb_orbit             # JPL SBDB detailed orbit
  - query_sbdb_close_approaches  # JPL CAD API
  - query_sentry_risk            # JPL CNEOS Sentry-II (authoritative NEO risk source)
  - query_damit_shape_model      # Durech+2010 (2010A&A...513A..46D)
  # -- formula computation --
  - compute_hg_magnitude         # Bowell+1989 (1989aste.conf..524B)
  - compute_afrho                # A'Hearn+1984 (1984AJ.....89..579A)
  - fit_neatm_diameter_albedo    # Harris+1998 + Mainzer+2011
  - compute_neo_collision_probability  # Opik 1951 / Wetherill 1967 / Morbidelli+2002
  # -- classification --
  - classify_asteroid_busdemeo   # DeMeo+2009 (2009Icar..202..160D)
  - classify_asteroid_sdss_colors  # Carvano+2010 (2010A&A...510A..43C)
