[pytest]
asyncio_mode = auto
markers =
    integration: marks tests that hit real external APIs (deselect with '-m "not integration"')
    slow: marks slow end-to-end tests that hit external APIs (deselect with '-m "not slow"')
    network: marks tests requiring network access to external astronomical services
# Coverage threshold: real coverage is ~57% (1819 passed / 192s, 2026-05-08).
# Threshold 45 reflects current state with ~12% regression headroom.
# Earlier audit thought coverage was 7.5%, but that was --collect-only
# import-time coverage; full pytest run actually yields 57%. Threshold raised
# from previous 50 → 45 to give small regressions room without going below
# real coverage minus a buffer. Run `scripts/stats.sh` style measurements
# before adjusting.
addopts = -m "not integration and not slow" --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=45
