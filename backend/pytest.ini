[pytest]
asyncio_mode = auto
markers =
    integration: marks tests that hit real external APIs (deselect with '-m "not integration"')
    slow: marks slow end-to-end tests that hit external APIs (deselect with '-m "not slow"')
    network: marks tests requiring network access to external astronomical services
# Coverage threshold: real coverage is ~60% (2466 passed, CI run 2026-07-02
# reported "Total coverage: 59.56%"). Threshold 55 keeps ~5% regression
# headroom; the old floor of 45 sat ~15 points below reality and could only
# catch catastrophic collapse. Earlier audit thought coverage was 7.5%, but
# that was --collect-only import-time coverage. Re-measure with a full run
# before adjusting.
addopts = -m "not integration and not slow" --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=55
