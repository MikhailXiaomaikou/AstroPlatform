# Red-team numeric-claim corpus for ``app.services.claim_validator``.
#
# Each case feeds a reply + tool_results pair into ``validate_claims`` and
# asserts the boolean ``expect_ok`` (True = no fabrication detected, False =
# at least one claim falls outside the harvested numeric universe within
# tolerance). Cases mirror real bug patterns the production system has seen.
#
# When adding a case:
# - keep ``reply`` short (one paragraph max)
# - keep ``tool_results`` minimal (just enough to set the universe / push
#   into strict-mode when the case calls for it)
# - prefer numbers that are NOT close to row counts / indices / 0 / 1
#   (those collide with the numeric universe naturally)
#
# The fail mode is per-case: if a case starts failing after a change, decide
# whether the SCIENCE is wrong (fix the case) or the VALIDATOR is wrong
# (fix the validator) — never silently relax expect_ok.

cases:
  # ── Numeric pool hits / misses ────────────────────────────────────
  - name: cosmology_h0_in_pool_passes
    description: H0 value matches Planck 2018 median in tool_results.
    reply: "Our analysis finds H0 = 67.36 km/s/Mpc, consistent with Planck."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          parameters:
            H0:
              median: 67.36
              hdi_94: [66.8, 67.9]
            omegam:
              median: 0.3153
            sigma8:
              median: 0.8111
            S8:
              median: 0.832
    expect_ok: true

  - name: cosmology_h0_fabricated_outside_tolerance
    description: H0=73.04 (SH0ES) claimed but tool_results contain only Planck (67.36).
    reply: "Our chain returns H0 = 73.04 km/s/Mpc."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          parameters:
            H0:
              median: 67.36
            omegam:
              median: 0.3153
            sigma8:
              median: 0.8111
            S8:
              median: 0.832
    expect_ok: false

  - name: cosmology_h0_within_default_tolerance
    description: claimed 67.4 vs universe 67.36 is within the default ±1% tolerance.
    reply: "We measure H0 = 67.4 km/s/Mpc from BAO+CMB."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          parameters:
            H0:
              median: 67.36
            omegam:
              median: 0.3153
            sigma8:
              median: 0.8111
            S8:
              median: 0.832
    expect_ok: true

  - name: cosmology_S8_fabricated
    description: S8 = 0.776 (DES) cited but only Planck S8=0.832 in universe.
    reply: "The S8 tension persists at S8 = 0.776 from weak lensing."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          parameters:
            H0:
              median: 67.36
            sigma8:
              median: 0.8111
            S8:
              median: 0.832
    expect_ok: false

  - name: cosmology_omega_m_in_pool
    description: Ωm in pool exactly.
    reply: "The matter density we recover is Omega_m = 0.3153."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          parameters:
            H0:
              median: 67.36
            omegam:
              median: 0.3153
            sigma8:
              median: 0.8111
            S8:
              median: 0.832
    expect_ok: true

  - name: cosmology_w0_fabricated
    description: w0 claim with no w0 in tool_results.
    reply: "We constrain w_0 = -0.95 from the joint fit."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          parameters:
            H0:
              median: 67.36
            omegam:
              median: 0.3153
            sigma8:
              median: 0.8111
            S8:
              median: 0.832
    expect_ok: false

  # ── Edge: no claims (honest abstention) ───────────────────────────
  - name: honest_abstention_no_numbers
    description: pure narrative with no numeric claims should always pass.
    reply: "We were unable to retrieve the relevant Planck data product for this redshift bin."
    tool_results: []
    expect_ok: true

  # ── Strict-mode edge (small universe) ─────────────────────────────
  - name: strict_mode_close_but_outside
    description: small universe triggers strict tolerance (0.1%); 67.50 vs 67.36 is ~0.21% diff — should block.
    reply: "Our chain returns H0 = 67.50 km/s/Mpc."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          H0_median: 67.36
    expect_ok: false

  - name: strict_mode_exact_in_small_universe
    description: small universe triggers strict tolerance; exact match still passes.
    reply: "Our chain returns H0 = 67.36 km/s/Mpc."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          H0_median: 67.36
    expect_ok: true

  # ── Solar system ──────────────────────────────────────────────────
  - name: solar_system_ceres_diameter_in_pool
    description: Ceres D=940 km present in universe.
    reply: "Our diameter estimate for Ceres is D = 940 km."
    tool_results:
      - tool: compute_solar_system_diameter
        result:
          diameter_km: 940
          albedo: 0.090
          method: harris_1998
    expect_ok: true

  - name: solar_system_ceres_diameter_fabricated
    description: D=600 km claimed but only ~940 km recovered.
    reply: "Our diameter estimate for Ceres is D = 600 km."
    tool_results:
      - tool: compute_solar_system_diameter
        result:
          diameter_km: 940
          albedo: 0.090
          method: harris_1998
    expect_ok: false

  # ── Exoplanet ─────────────────────────────────────────────────────
  - name: exoplanet_T_eq_in_pool
    description: T_eq close to HD 209458 b in universe.
    reply: "We compute an equilibrium temperature of T_eq = 1347 K."
    tool_results:
      - tool: compute_equilibrium_temperature
        result:
          T_eq_K: 1346.67
          albedo_used: 0.3
    expect_ok: true

  - name: exoplanet_T_eq_fabricated
    description: T_eq=2000 K outside universe.
    reply: "We compute an equilibrium temperature of T_eq = 2000 K."
    tool_results:
      - tool: compute_equilibrium_temperature
        result:
          T_eq_K: 1346.67
    expect_ok: false

  - name: exoplanet_density_in_pool
    description: density value matches tool_results.
    reply: "The bulk density is 5.50 g/cm^3."
    tool_results:
      - tool: compute_planet_density
        result:
          density_g_cm3: 5.495
    expect_ok: true

  # ── Citation-string laundering guard ──────────────────────────────
  # Regression target for the 2026-05-28 _CITATION_KEYS_BLACKLIST fix.
  # Before the fix, _iter_numeric_values pulled scattered digits out of
  # bibcode / doi / arxiv strings (e.g. "2020A&A...641A...6P" leaked
  # 2020 / 641 / 6 into the universe), so an LLM claim of "641" would
  # accidentally validate against a parsed-out volume number.
  - name: numeric_in_bibcode_string_not_in_universe
    description: |
      A bibcode like "2020A&A...641A...6P" must NOT leak its parsed-out tokens
      (2020 / 641 / 0.641) into the numeric universe. Before the
      _CITATION_KEYS_BLACKLIST fix, an LLM could write 'Omega_m = 0.641' and
      have it validate against the bibcode-laundered 0.641. After the fix,
      citations are skipped entirely so the only universe is whatever the
      tool actually measured — and a fabricated Ωm=0.641 has no support.
    reply: "We measure Omega_m = 0.641 from this analysis."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          provenance:
            cosmology_likelihood:
              citations:
                - bibcode: "2020A&A...641A...6P"
                  doi: "10.1051/0004-6361/201833910"
    expect_ok: false

  # ── 4.1 cross-label ±1% laundering (2026-05-29) ───────────────────
  # The flat numeric universe is label-blind: before label-aware matching, a
  # cosmology parameter claim was "supported" by ANY tool number within ±1%,
  # so a fabricated value could launder off a coincidentally-close number for a
  # DIFFERENT quantity. These cases pin that the value must now match its OWN
  # parameter's tool-produced values.
  - name: cosmology_sigma8_launders_off_omegam
    description: |
      σ8 = 0.315 is fabricated (real σ8 = 0.811) but lands within ±1% of the
      UNRELATED Ωm = 0.3153 in the universe. Pre-4.1 the flat universe let it
      pass; label-aware matching ties the σ8 claim to the σ8 values only, so it
      is correctly blocked.
    reply: "Our fit gives sigma_8 = 0.315 from the joint chain."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          parameters:
            H0: {median: 67.36}
            omegam: {median: 0.3153}
            sigma8: {median: 0.811}
            S8: {median: 0.832}
    expect_ok: false

  - name: cosmology_s8_launders_off_sigma8
    description: |
      S8 = 0.811 is fabricated (real S8 = 0.832) but exactly equals the σ8 value
      in the universe. Must be blocked: an S8 claim can only be supported by S8
      values, not by σ8.
    reply: "We find S8 = 0.811 from weak lensing."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          parameters:
            H0: {median: 67.36}
            sigma8: {median: 0.811}
            S8: {median: 0.832}
    expect_ok: false

  - name: cosmology_h0_launders_off_unrelated_chi2
    description: |
      H0 = 70.5 is fabricated (real H0 = 67.36) but matches an unrelated χ² = 70.5
      that flows into the global universe. Label-aware matching blocks it because
      70.5 is not within ±1% of any H0 value the tools produced.
    reply: "The Hubble rate is H0 = 70.5 km/s/Mpc."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          parameters:
            H0: {median: 67.36}
          fit_statistics:
            chi2: 70.5
    expect_ok: false

  - name: cosmology_sigma8_legit_passes
    description: σ8 claim equals the tool-produced σ8 — must pass (no over-block).
    reply: "Our fit gives sigma_8 = 0.811."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          parameters:
            sigma8: {median: 0.811}
            omegam: {median: 0.3153}
    expect_ok: true

  - name: cosmology_s8_one_sigma_edge_passes
    description: |
      Quoting an explicitly identified lower 1σ edge of S8 must use the typed
      lower-bound bucket; HDI edges never enter the central-estimate bucket.
    reply: "S8 reaches as low as S8 = 0.81 at the 1-sigma edge."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          parameters:
            S8: {median: 0.83, hdi_94: [0.81, 0.85]}
    expect_ok: true

  - name: cosmology_s8_registry_posterior_context_is_blocked
    description: |
      A registry row is literature/posterior context, not an executed platform
      likelihood. Its compressed mean must not enter the numerical evidence
      universe; quote the value only after a citation-backed literature lookup
      or an eligible fit result.
    reply: "KiDS-1000 reports S8 = 0.759."
    tool_results:
      - tool: list_cosmology_datasets
        result:
          datasets:
            - key: kids1000_wl
              compressed_likelihood:
                parameters: ["S8"]
                mean: [0.759]
    expect_ok: false

  - name: numeric_in_sha256_digest_not_in_universe
    description: |
      2026-06-12 union3 review: hex digit runs inside sha256 digests
      (artifact_sha256, runner_hash, ...) must NOT enter the numeric universe.
      The union3 chain's always-on digest '64c79abd...146...' once validated a
      fabricated H0 = 64.3 — the bibcode-laundering class applied to hashes.
    reply: "The fit prefers H0 = 64.3 km/s/Mpc."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        result:
          parameters:
            omegam: {median: 0.356}
          provenance:
            cosmology_likelihood:
              artifact_sha256:
                union3: "64c79abd24bf5154bc1e38ad0c031e31dd6247cdcc5ca930829698169809a146"
          result_hash: "9e3779b97f4a7c15f39cc0605cedc834"
    expect_ok: false

  - name: numeric_in_tool_input_not_in_universe
    description: |
      2026-06-12 P1b: a fabricated number echoed into a tool ARGUMENT (search
      query string or structured input field) must not ground the claim — the
      universe is built from tool RESULTS only (the numeric twin of the B4
      citation-pool rule).
    reply: "The fit prefers H0 = 71.4 km/s/Mpc."
    tool_results:
      - tool: search_literature
        input:
          query: "Hubble constant H0 = 71.4 km/s/Mpc local measurements"
        result:
          results: []
          n_results: 0
    expect_ok: false

  - name: numeric_in_report_prose_not_in_universe
    description: |
      2026-06-12 P1b: rendered research deliverables (markdown /
      paper_draft_markdown / bibtex) are a RENDERING of evidence, not
      evidence — numbers inside them must not re-ground claims.
    reply: "Our analysis finds H0 = 71.4 at publication tier."
    tool_results:
      - tool: export_research_report
        input: {}
        result:
          markdown: "## Findings: H0 = 71.4 (publication-ready)"
          paper_draft_markdown: "Abstract: we find H0 = 71.4."
    expect_ok: false

  - name: numeric_in_run_adql_query_echo_not_in_universe
    description: |
      2026-06-12 review: run_adql copies the model-authored SQL into
      result["query"]; a fabricated number embedded there (or in a SQL
      comment) must not ground a claim even though it sits in the RESULT.
    reply: "The fit prefers H0 = 71.4 km/s/Mpc."
    tool_results:
      - tool: run_adql
        input:
          query: "SELECT TOP 5 ra, dec FROM gaia WHERE parallax > 71.4"
        result:
          query: "SELECT TOP 5 ra, dec FROM gaia WHERE parallax > 71.4"
          row_count: 5
          data:
            ra: [10.1, 11.2, 12.3]
    expect_ok: false

  - name: numeric_in_tool_params_echo_not_in_universe
    description: |
      2026-06-12 review: query_high_velocity_stars echoes its numeric
      arguments into result["params"]; those are model inputs, not
      measurements, and must not ground a claim.
    reply: "These stars move at v_tan = 713 km/s."
    tool_results:
      - tool: query_high_velocity_stars
        input: {}
        result:
          params:
            min_vtan_kms: 713
            min_parallax_mas: 0.33
          data:
            vtan: [1590.18, 1602.4]
    expect_ok: false

  - name: numeric_in_legacy_cosmology_manifest_not_in_universe
    description: |
      2026-06-12 round-2 review: compare_luminosity_distances / fit_line_lfr
      echo the ASSUMED cosmology into their result. A model-authored legacy
      spec ("FlatLambdaCDM_H73p8_Om0p295") round-trips the model's own digits
      with bibcode=None and must not ground a measurement claim; curated
      presets (real bibcode) stay citeable separately.
    reply: "We adopt the local distance ladder value H0 = 73.8 km/s/Mpc."
    tool_results:
      - tool: compare_luminosity_distances
        input:
          target_cosmology: "FlatLambdaCDM_H73p8_Om0p295"
        result:
          target_cosmology:
            H0_km_s_Mpc: 73.8
            Om0: 0.295
            bibcode: null
          data:
            ratio: [1.02, 1.05]
    expect_ok: false

  - name: numeric_echoed_from_tool_input_subtracted_structurally
    description: |
      2026-06-12 round-3: the structural anti-echo subtracts every number the
      model authored in a tool INPUT, so a fabricated value echoed into ANY
      result key (here audit_published_constraint's `claimed`) is removed from
      the universe regardless of the echo key.
    reply: "The published Hubble constant is H0 = 71.4 km/s/Mpc."
    tool_results:
      - tool: audit_published_constraint
        input:
          param: "H0"
          claimed: [71.4, 1.0]
        result:
          param: "H0"
          claimed_value: 71.4
          status: "COMPLETED"
          reproduced: [67.4]
    expect_ok: false

  - name: invalid_model_comparison_delta_not_claimable
    description: |
      2026-06-12 matrix-gate review: opening the phase-1 matrix made
      model_comparisons LLM-visible. A comparison whose input chain is
      blocked (or whose representations differ) is stamped __do_not_claim__,
      so its delta_chi2/delta_aic — computed from one-effective-sample noise —
      must not ground a reply claim.
    reply: "The fit gives chi-squared = 2.11, so wCDM is favored here."
    tool_results:
      - tool: run_research_matrix
        input: {}
        result:
          analysis_status: "RESEARCH_MATRIX_PARTIAL"
          model_comparisons:
            - baseline_model: "lcdm"
              extended_model: "wcdm"
              delta_chi2: 0.115
              delta_aic: 2.11
              preferred: "undetermined"
              comparison_valid: false
              comparison_warning: "the extended fit carries chain_tier='blocked'"
              __do_not_claim__: true
    expect_ok: false

  - name: valid_model_comparison_delta_stays_claimable
    description: |
      Control for invalid_model_comparison_delta_not_claimable: a
      A comparison_valid=true verdict is claimable only when both objectives
      are attested likelihood-only MLEs on one explicit likelihood fingerprint.
    reply: "The extended fit improves chi-squared: -4.58 in this exploratory comparison."
    tool_results:
      - tool: run_research_matrix
        input: {}
        result:
          analysis_status: "RESEARCH_MATRIX_PARTIAL"
          model_comparisons:
            - baseline_model: "lcdm"
              extended_model: "wcdm"
              delta_chi2: -4.58
              delta_aic: -2.58
              preferred: "wcdm"
              comparison_valid: true
              baseline_chi2_kind: "likelihood_only_mle"
              extended_chi2_kind: "likelihood_only_mle"
              likelihood_fingerprint: "sha256:matched-likelihood"
              baseline_chain_tier: "publication"
              extended_chain_tier: "exploratory"
    expect_ok: true

  - name: comparison_valid_flag_without_mle_attestation_not_claimable
    description: |
      A forged or legacy comparison_valid=true flag must not make posterior-draw
      AIC deltas claimable without matched likelihood-only MLE attestations.
    reply: "The extended fit improves chi-squared by -4.58."
    tool_results:
      - tool: run_research_matrix
        input: {}
        result:
          analysis_status: "RESEARCH_MATRIX_PARTIAL"
          model_comparisons:
            - baseline_model: "lcdm"
              extended_model: "wcdm"
              delta_chi2: -4.58
              delta_aic: -2.58
              preferred: "wcdm"
              comparison_valid: true
              baseline_chi2_kind: "posterior_draw_minimum"
              extended_chi2_kind: "posterior_draw_minimum"
    expect_ok: false

  - name: arxiv_id_in_source_locator_prose_not_in_universe
    description: |
      2026-06-12 DR12 review BLOCKER: "arXiv:1607.03155" inside the
      compressed_sources source_locator prose tokenizes to 1607.03155 —
      IN-BAND for the DR12 dimensional convention (D_M·rs_fid/r_d ~
      1512-2307 Mpc). A fabricated distance laundered off the citation id
      must be blocked; source_locator/approximation are methodology prose,
      never measurement evidence.
    reply: "At z=0.51 the DR12 consensus gives a transverse distance of 1607 Mpc."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        input: {}
        result:
          analysis_status: "COMPLETED"
          provenance:
            cosmology_likelihood:
              compressed_sources:
                - dataset_key: "sdss_dr12_consensus_bao"
                  source_locator: "BOSS DR12 consensus BAO (Alam et al. 2017, arXiv:1607.03155)"
                  approximation: "rs_fid=147.78 Mpc storage convention"
    expect_ok: false

  - name: structured_rs_fid_field_stays_claimable
    description: |
      Control for arxiv_id_in_source_locator_prose_not_in_universe: the
      release's published fiducial sound horizon is exposed as a structured
      numeric field (rs_fid_mpc) and remains quotable.
    reply: "The DR12 release stores values against rs_fid = 147.78 Mpc."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        input: {}
        result:
          analysis_status: "COMPLETED"
          provenance:
            cosmology_likelihood:
              compressed_sources:
                - dataset_key: "sdss_dr12_consensus_bao"
                  source_locator: "BOSS DR12 consensus BAO (Alam et al. 2017, arXiv:1607.03155)"
                  rs_fid_mpc: 147.78
    expect_ok: true

  - name: registry_version_prose_digits_not_in_universe
    description: |
      2026-06-12 eBOSS-grid review (DR12-BLOCKER family): dataset
      version/display_name strings carry table dimensions ("released
      399-point probability table", "50x50 grid") that validated fabricated
      count claims. Naming prose is never measurement evidence.
    reply: "The fit used 399 quasars across the sample."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        input: {}
        result:
          analysis_status: "COMPLETED"
          datasets_used:
            - key: "eboss_dr16_elg_bao"
              display_name: "eBOSS DR16 ELG BAO (non-Gaussian D_V/r_d table)"
              version: "SDSS DR16 ELG BAO-only: released 399-point probability table for D_V/r_d at z=0.845"
    expect_ok: false

  - name: numeric_in_warnings_list_not_in_universe
    description: |
      2026-07-07 backlog P3b: `warnings` is a LIST of prose strings on nearly
      every runner result, so the string-only _FREETEXT_KEYS skip never fired
      and numbers inside the prose ("w=-1 held fixed", "fit 1042 supernovae",
      years) leaked into the claimable universe. A fabricated sample-size
      claim laundered off warning prose must be blocked — warnings are
      diagnostics, never measurement evidence. This case exercises the LIST
      channel (the actual bug); a string-valued warning was already skipped.
    reply: "The joint fit used 1042 supernovae."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        input: {}
        result:
          analysis_status: "COMPLETED"
          parameters:
            H0: {median: 67.36}
            omegam: {median: 0.3153}
            sigma8: {median: 0.8111}
            S8: {median: 0.832}
          warnings:
            - "Compressed Gaussian summary likelihood; the source release fit 1042 supernovae with w=-1 held fixed."
    expect_ok: false

  - name: warnings_prose_with_structured_diagnostics_sibling_stays_claimable
    description: |
      Specificity control for numeric_in_warnings_list_not_in_universe: the
      diagnostic numbers a model may honestly quote (ESS / R-hat) also live in
      STRUCTURED result fields (chain_diagnostics.*.ess_bulk, proposal_ess),
      so skipping the warnings prose must not orphan an honest low-ESS
      disclosure — it grounds via the structured sibling, mirroring the
      source_locator -> rs_fid_mpc pattern.
    reply: "Treat this as exploratory only: min ESS = 45 for the chain."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        input: {}
        result:
          analysis_status: "COMPLETED"
          parameters:
            H0: {median: 67.36}
            omegam: {median: 0.3153}
          chain_diagnostics:
            parameters:
              H0: {ess_bulk: 45, rhat: 1.02}
          warnings:
            - "MCMC chain min ESS=45, max R-hat=1.020; below exploratory floor (ESS>=100)."
    expect_ok: true

  - name: structured_z_coverage_keeps_honest_redshift_claimable
    description: |
      Control + tuple-branch pin: with the naming prose skipped, the honest
      "at z=0.845" claim must still ground via the structured z_coverage
      field (raw tool results carry tuples; the validator walks them like
      lists since 2026-06-12).
    reply: "The ELG sample sits at z = 0.845."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        input: {}
        result:
          analysis_status: "COMPLETED"
          datasets_used:
            - key: "eboss_dr16_elg_bao"
              display_name: "eBOSS DR16 ELG BAO (non-Gaussian D_V/r_d table)"
              version: "SDSS DR16 ELG BAO-only: released 399-point probability table for D_V/r_d at z=0.845"
              z_coverage: [0.845, 0.845]
    expect_ok: true

  - name: numeric_in_chain_artifacts_not_in_universe
    description: |
      2026-07-24 chain persistence: chain_artifacts carries storage keys,
      uuids, sha256 digests, and byte sizes for the persisted getdist files.
      Those digits are reproducibility metadata, never measurements — a
      fabricated numeric claim laundered off an artifact byte size must be
      blocked (chain_artifacts is a _NON_EVIDENCE_KEYS whole-subtree skip).
    reply: "The joint fit used 52941 supernovae."
    tool_results:
      - tool: run_cosmology_likelihood_chain
        input: {}
        result:
