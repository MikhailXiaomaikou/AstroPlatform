services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: astro
      POSTGRES_PASSWORD: astro
      POSTGRES_DB: astro
    ports:
      # 只绑回环, 防止意外把 compose 跑到云 VPS 上时数据库裸奔 + 弱默认密码
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astro"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Celery is a delivery queue, not a disposable cache. Persist writes and
    # fail producers when full instead of evicting queued tasks.
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 192mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TOOL_VERSION: ${GIT_COMMIT:?GIT_COMMIT must be one full 40-character Git SHA}
    command: ["sh", "-c", "alembic upgrade head && alembic check"]
    restart: "no"
    environment:
      ENV: production
      APP_ROLE: migration
      SCIENCE_EXECUTION_BACKEND: celery
      DATABASE_URL: postgresql+asyncpg://astro:astro@postgres:5432/astro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TOOL_VERSION: ${GIT_COMMIT:?GIT_COMMIT must be one full 40-character Git SHA}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENV: production
      APP_ROLE: api
      SCIENCE_EXECUTION_BACKEND: https_worker
      DATABASE_URL: postgresql+asyncpg://astro:astro@postgres:5432/astro
      REDIS_URL: redis://redis:6379/0
      # 生产密钥必须显式提供, 不给弱默认值 (render.yaml 用 generateValue, 这里同理 fail-fast)
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set explicitly (no default)}
      FERNET_KEY: ${FERNET_KEY:?FERNET_KEY must be set explicitly (encrypts stored user API keys)}
      ADMIN_SECRET: ${ADMIN_SECRET:?ADMIN_SECRET must be set for invite-only signup}
      DELETION_TOMBSTONE_KEY: ${DELETION_TOMBSTONE_KEY:?DELETION_TOMBSTONE_KEY must be set explicitly}
      DELETION_TOMBSTONE_KEY_ID: ${DELETION_TOMBSTONE_KEY_ID:-deletion-compose-v1}
      DELETION_TOMBSTONE_VERIFICATION_KEYS: ${DELETION_TOMBSTONE_VERIFICATION_KEYS:-}
      EVIDENCE_SIGNING_KEY: ${EVIDENCE_SIGNING_KEY:?EVIDENCE_SIGNING_KEY must be set explicitly}
      EVIDENCE_SIGNING_KEY_ID: ${EVIDENCE_SIGNING_KEY_ID:-evidence-compose-v1}
      EVIDENCE_VERIFICATION_KEYS: ${EVIDENCE_VERIFICATION_KEYS:-}
      SIGNUP_MODE: invite_only
      CLAIM_AUDIT_ENABLED: "false"
      RESEARCH_WORKSPACE_ENABLED: "false"
      ARXIV_READER_ENABLED: "false"
      UNION3_REPRODUCTION_ENABLED: "false"
      EVIDENCE_PACK_V2_ENABLED: "false"
      LOCAL_SCIENCE_WORKER_ENABLED: "false"
      CLAIM_AUDIT_EXECUTION_MODE: https_worker
      SHARED_DEEPSEEK_API_KEY_ENABLED: "false"
      PRIVACY_OPERATOR_NAME: ${PRIVACY_OPERATOR_NAME:?PRIVACY_OPERATOR_NAME must identify the operator}
      PRIVACY_CONTACT: ${PRIVACY_CONTACT:?PRIVACY_CONTACT must be set}
      PRIVACY_JURISDICTION: ${PRIVACY_JURISDICTION:?PRIVACY_JURISDICTION must be set}
      WORKER_TASK_SIGNING_PRIVATE_KEY: ${WORKER_TASK_SIGNING_PRIVATE_KEY:-}
      WORKER_TASK_SIGNING_KEY_ID: ${WORKER_TASK_SIGNING_KEY_ID:-}
      WORKER_TASK_SIGNING_PUBLIC_KEY: ${WORKER_TASK_SIGNING_PUBLIC_KEY:-}
      WORKER_TASK_VERIFICATION_KEYS: ${WORKER_TASK_VERIFICATION_KEYS:-}
      DOCKER_IMAGE_DIGEST: ${WORKER_IMAGE_DIGEST:-}
      EVIDENCE_V2_SIGNING_PRIVATE_KEY: ${EVIDENCE_V2_SIGNING_PRIVATE_KEY:-}
      EVIDENCE_V2_SIGNING_KEY_ID: ${EVIDENCE_V2_SIGNING_KEY_ID:-}
      EVIDENCE_V2_SIGNING_PUBLIC_KEY: ${EVIDENCE_V2_SIGNING_PUBLIC_KEY:-}
      EVIDENCE_V2_VERIFICATION_KEYS: ${EVIDENCE_V2_VERIFICATION_KEYS:-}
      PIPELINE_MODE: celery
      STORAGE_BACKEND: local
      PERSISTENT_STORAGE_MOUNT: /app/data
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      # Compose publishes uvicorn directly; there is no trusted Render proxy.
      TRUSTED_PROXY_MODE: none
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - runtime-data:/app/data
      - fitsdata:/app/data/fits
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/deep', timeout=5).read()"]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TOOL_VERSION: ${GIT_COMMIT:?GIT_COMMIT must be one full 40-character Git SHA}
    command: celery -A celery_worker worker --loglevel=info --concurrency=1 --queues=control,maintenance,verification --hostname=worker-$${TOOL_VERSION}@%h
    restart: unless-stopped
    environment:
      ENV: production
      APP_ROLE: control_worker
      SCIENCE_EXECUTION_BACKEND: https_worker
      DATABASE_URL: postgresql+asyncpg://astro:astro@postgres:5432/astro
      REDIS_URL: redis://redis:6379/0
      DELETION_TOMBSTONE_KEY: ${DELETION_TOMBSTONE_KEY:?DELETION_TOMBSTONE_KEY must be set explicitly}
      DELETION_TOMBSTONE_KEY_ID: ${DELETION_TOMBSTONE_KEY_ID:-deletion-compose-v1}
      DELETION_TOMBSTONE_VERIFICATION_KEYS: ${DELETION_TOMBSTONE_VERIFICATION_KEYS:-}
      EVIDENCE_SIGNING_KEY: ${EVIDENCE_SIGNING_KEY:?EVIDENCE_SIGNING_KEY must be set explicitly}
      EVIDENCE_SIGNING_KEY_ID: ${EVIDENCE_SIGNING_KEY_ID:-evidence-compose-v1}
      EVIDENCE_VERIFICATION_KEYS: ${EVIDENCE_VERIFICATION_KEYS:-}
      CLAIM_AUDIT_ENABLED: "false"
      RESEARCH_WORKSPACE_ENABLED: "false"
      ARXIV_READER_ENABLED: "false"
      UNION3_REPRODUCTION_ENABLED: "false"
      EVIDENCE_PACK_V2_ENABLED: "false"
      LOCAL_SCIENCE_WORKER_ENABLED: "false"
      EVIDENCE_V2_SIGNING_PRIVATE_KEY: ${EVIDENCE_V2_SIGNING_PRIVATE_KEY:-}
      EVIDENCE_V2_SIGNING_KEY_ID: ${EVIDENCE_V2_SIGNING_KEY_ID:-}
      EVIDENCE_V2_SIGNING_PUBLIC_KEY: ${EVIDENCE_V2_SIGNING_PUBLIC_KEY:-}
      EVIDENCE_V2_VERIFICATION_KEYS: ${EVIDENCE_V2_VERIFICATION_KEYS:-}
      PIPELINE_MODE: celery
      CLAIM_AUDIT_EXECUTION_MODE: https_worker
      STORAGE_BACKEND: local
      # Backup scheduling and execution require an explicit opt-in. The
      # dedicated encryption key remains external to Compose and the archive.
      POSTGRES_BACKUP_ENABLED: ${POSTGRES_BACKUP_ENABLED:-false}
      POSTGRES_BACKUP_ENCRYPTION_KEY: ${POSTGRES_BACKUP_ENCRYPTION_KEY:-}
      POSTGRES_BACKUP_ENCRYPTION_KEY_ID: ${POSTGRES_BACKUP_ENCRYPTION_KEY_ID:-postgres-backup-compose-v1}
      POSTGRES_BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-30}
      POSTGRES_BACKUP_S3_PREFIX: ${POSTGRES_BACKUP_S3_PREFIX:-backups/postgresql}
      POSTGRES_BACKUP_ALLOW_INSECURE_S3: ${POSTGRES_BACKUP_ALLOW_INSECURE_S3:-false}
      FERNET_KEY_ID: ${FERNET_KEY_ID:-fernet-compose-v1}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ADDRESSING_STYLE: ${S3_ADDRESSING_STYLE:-path}
      CELERY_TASK_SOFT_TIME_LIMIT_SECONDS: "43200"
      CELERY_TASK_TIME_LIMIT_SECONDS: "45000"
      CELERY_VISIBILITY_TIMEOUT_SECONDS: "46800"
      RESEARCH_JOB_STALE_SECONDS: "50400"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - runtime-data:/app/data
      - fitsdata:/app/data/fits
    healthcheck:
      test: ["CMD-SHELL", "celery -A celery_worker inspect ping -d worker-$${TOOL_VERSION}@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TOOL_VERSION: ${GIT_COMMIT:?GIT_COMMIT must be one full 40-character Git SHA}
    command: celery -A celery_worker beat --loglevel=info --pidfile=/tmp/celerybeat.pid
    restart: unless-stopped
    environment:
      ENV: production
      APP_ROLE: beat
      SCIENCE_EXECUTION_BACKEND: https_worker
      DATABASE_URL: postgresql+asyncpg://astro:astro@postgres:5432/astro
      REDIS_URL: redis://redis:6379/0
      POSTGRES_BACKUP_ENABLED: ${POSTGRES_BACKUP_ENABLED:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /tmp/celerybeat.pid && kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The Compose image must call the Compose backend, never the hosted API.
        VITE_API_URL: http://localhost:8000
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

volumes:
  pgdata:
  redisdata:
  runtime-data:
  fitsdata:
