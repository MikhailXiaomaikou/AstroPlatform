databases:
  - name: standard-astro-db
    plan: free
    databaseName: astro
    user: astro

services:
  # ── Backend API ──
  - type: web
    name: standard-astro-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    # R18: /health/deep verifies DB + Redis + AI backend so Render's
    # auto-rollback catches bad deploys that would break chat even when
    # the process itself is up.
    healthCheckPath: /health/deep
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: standard-astro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: standard-astro-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PIPELINE_MODE
        value: celery
      - key: SANDBOX_BACKEND
        value: subprocess
      - key: CORS_ORIGINS
        value: https://astro-frontend-tyfr.onrender.com,https://standard-astro-frontend-tyfr.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false

  # ── Celery Worker ──
  - type: worker
    name: standard-astro-celery-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    dockerCommand: celery -A celery_worker worker --loglevel=info --concurrency=2
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: standard-astro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: standard-astro-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: SANDBOX_BACKEND
        value: subprocess

  # ── Celery Beat (scheduler) ──
  - type: worker
    name: standard-astro-celery-beat
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    dockerCommand: celery -A celery_worker beat --loglevel=info
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: standard-astro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: standard-astro-redis
          type: redis
          property: connectionString

  # ── Frontend ──
  - type: web
    name: standard-astro-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://astro-backend-h4x1.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  # ── Redis ──
  - type: redis
    name: standard-astro-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
