# ─────────────────────────────────────────────────────────────────────
# render.yaml — production topology managed as a Render Blueprint.
#
# Production topology: 5 services + 1 database.
#   - standard-astro-db (Basic-256mb)
#   - standard-astro-backend (Standard, 1 CPU / 2 GB)
#   - standard-astro-frontend (Static)
#   - standard-astro-celery-worker
#   - standard-astro-celery-beat
#   - standard-astro-redis
#
# The backend pre-deploy command is the only production schema writer.
# /health/deep remains unhealthy until schema, disk, broker and worker
# readiness all pass. Redis uses noeviction so queued tasks are never
# discarded to make room for cache entries.
# ─────────────────────────────────────────────────────────────────────

databases:
  - name: standard-astro-db
    plan: basic-256mb           # 1 GB storage / 256 MB RAM / 0.1 CPU
    databaseName: astro
    user: astro

services:
  # ── Durable Celery broker / shared runtime cache ──
  - type: keyvalue
    name: standard-astro-redis
    plan: starter
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  # ── Backend API ──
  - type: web
    name: standard-astro-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: standard              # 2 GB RAM / 1 CPU
    autoDeployTrigger: checksPass
    preDeployCommand: sh -c 'alembic upgrade head && alembic check'
    # /health/deep verifies schema + durable storage + broker + worker so
    # Render rejects a process that cannot execute the production workload.
    healthCheckPath: /health/deep
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: standard-astro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: standard-astro-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FERNET_KEY
        generateValue: true
      - key: EVIDENCE_SIGNING_KEY
        generateValue: true
      - key: EVIDENCE_SIGNING_KEY_ID
        value: evidence-prod-v1
      # JSON object of retired key-id -> secret.  Populate before rotating the
      # current key; legacy JWT evidence can retain its old JWT secret here.
      - key: EVIDENCE_VERIFICATION_KEYS
        sync: false
      - key: PIPELINE_MODE
        value: celery
      # Shared research-object storage. Set bucket + credentials (and endpoint
      # for R2/MinIO) before syncing an existing Blueprint; startup fails closed
      # when required S3 credentials are absent.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ADDRESSING_STYLE
        value: path
      - key: PERSISTENT_STORAGE_MOUNT
        value: /app/data
      - key: SANDBOX_BACKEND
        value: disabled
      - key: CORS_ORIGINS
        value: https://astro-frontend-tyfr.onrender.com,https://standard-astro-frontend-tyfr.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # PART AI Phase 5 #2 Track 2 — external_cobaya likelihood backend.
      # COBAYA_PACKAGES_PATH points cobaya at a writable cache for
      # likelihood data tables. It must match the directory created in
      # backend/Dockerfile (/app/cobaya_packages, owned by `app` user).
      - key: COBAYA_PACKAGES_PATH
        value: /app/cobaya_packages
      # CAMB will fork OpenMP threads otherwise; pin to 1 so a CAMB
      # call doesn't blow past container memory.
      - key: OMP_NUM_THREADS
        value: "1"
      # Master flag for the cobaya subprocess runner. Off by default.
      - key: EXTERNAL_COBAYA_ENABLED
        value: "false"
    # Research objects use shared S3-compatible storage. This single-service
    # disk preserves gate-event JSONL, local caches and portable export staging.
    disk:
      name: standard-astro-data
      mountPath: /app/data
      sizeGB: 10

  # ── Celery worker ──
  - type: worker
    name: standard-astro-celery-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    autoDeployTrigger: checksPass
    # The backend owns migrations.  A worker deploy is independent on Render,
    # so it must wait for this image's exact Alembic head before consuming work.
    dockerCommand: sh -c 'python scripts/wait_for_schema_head.py && exec celery -A celery_worker worker --loglevel=info --concurrency=2 --hostname=worker@%h'
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: standard-astro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: standard-astro-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: JWT_SECRET
      - key: FERNET_KEY
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: FERNET_KEY
      - key: EVIDENCE_SIGNING_KEY
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: EVIDENCE_SIGNING_KEY
      - key: EVIDENCE_SIGNING_KEY_ID
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: EVIDENCE_SIGNING_KEY_ID
      - key: EVIDENCE_VERIFICATION_KEYS
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: EVIDENCE_VERIFICATION_KEYS
      - key: ANTHROPIC_API_KEY
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: ANTHROPIC_API_KEY
      - key: PIPELINE_MODE
        value: celery
      - key: SCHEMA_WAIT_TIMEOUT_SECONDS
        value: "900"
      - key: CELERY_TASK_SOFT_TIME_LIMIT_SECONDS
        value: "43200"
      - key: CELERY_TASK_TIME_LIMIT_SECONDS
        value: "45000"
      - key: CELERY_VISIBILITY_TIMEOUT_SECONDS
        value: "46800"
      - key: RESEARCH_JOB_STALE_SECONDS
        value: "50400"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: S3_ENDPOINT_URL
      - key: S3_BUCKET
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: S3_BUCKET
      - key: S3_ACCESS_KEY_ID
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: S3_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: S3_SECRET_ACCESS_KEY
      - key: S3_REGION
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: S3_REGION
      - key: S3_ADDRESSING_STYLE
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: S3_ADDRESSING_STYLE
      - key: SANDBOX_BACKEND
        value: disabled
      - key: ASTRO_RESEARCH_FOCUS
        value: cosmology
      - key: COBAYA_PACKAGES_PATH
        value: /app/cobaya_packages
      - key: OMP_NUM_THREADS
        value: "1"
      - key: EXTERNAL_COBAYA_ENABLED
        value: "false"

  # ── Celery scheduler ──
  - type: worker
    name: standard-astro-celery-beat
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    autoDeployTrigger: checksPass
    # Beat must not enqueue tasks from a new image until the backend migration
    # for that same image has reached Alembic head.
    dockerCommand: sh -c 'python scripts/wait_for_schema_head.py && exec celery -A celery_worker beat --loglevel=info --pidfile=/tmp/celerybeat.pid'
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: standard-astro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: standard-astro-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: JWT_SECRET
      - key: FERNET_KEY
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: FERNET_KEY
      - key: EVIDENCE_SIGNING_KEY
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: EVIDENCE_SIGNING_KEY
      - key: EVIDENCE_SIGNING_KEY_ID
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: EVIDENCE_SIGNING_KEY_ID
      - key: EVIDENCE_VERIFICATION_KEYS
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: EVIDENCE_VERIFICATION_KEYS
      - key: PIPELINE_MODE
        value: celery
      - key: SCHEMA_WAIT_TIMEOUT_SECONDS
        value: "900"
      - key: ASTRO_RESEARCH_FOCUS
        value: cosmology

  # ── Frontend ──
  - type: web
    name: standard-astro-frontend
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://astro-backend-h4x1.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
