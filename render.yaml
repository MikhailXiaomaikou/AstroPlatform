# ─────────────────────────────────────────────────────────────────────
# render.yaml — target production topology managed as a Render Blueprint.
#
# Production topology: 5 services + 1 database.
#   - standard-astro-db (Basic-256mb)
#   - standard-astro-backend (Standard, 1 CPU / 2 GB)
#   - standard-astro-frontend (Static)
#   - standard-astro-celery-worker
#   - standard-astro-celery-beat
#   - standard-astro-redis
#
# The backend pre-deploy command is the only production schema writer.
# /health/ready is the bounded Render traffic gate; /health/deep remains the
# full post-deploy infrastructure check. Redis uses noeviction so queued tasks
# are never discarded to make room for cache entries.
# ─────────────────────────────────────────────────────────────────────

databases:
  - name: standard-astro-db
    # Confirm the current provider capacity and cost before any Blueprint sync;
    # this target intentionally does not make a price or storage-size claim.
    plan: basic-256mb
    postgresMajorVersion: "16"  # Must match CI and the UUID migration drill.
    databaseName: astro
    user: astro
    ipAllowList: []             # Private-network access only.

services:
  # ── Durable Celery broker / shared runtime cache ──
  - type: keyvalue
    name: standard-astro-redis
    plan: starter
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot
    ipAllowList: []

  # ── Backend API ──
  - type: web
    name: standard-astro-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: standard              # 2 GB RAM / 1 CPU
    autoDeployTrigger: checksPass
    preDeployCommand: sh -c 'alembic upgrade head && alembic check'
    # Render requires HTTP health checks to finish within five seconds. This
    # bounded endpoint verifies DB connectivity + exact Alembic head; the
    # heavier S3/Redis/Celery round trip remains at /health/deep.
    healthCheckPath: /health/ready
    envVars:
      - key: ENV
        value: production
      - key: APP_ROLE
        value: api
      - key: SCIENCE_EXECUTION_BACKEND
        value: celery
      - key: DATABASE_URL
        fromDatabase:
          name: standard-astro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: standard-astro-redis
          type: keyvalue
          property: connectionString
      # JsonKvStore powers deletion markers, async jobs, workflow checkpoints,
      # and user tools. Production must never fall back to per-instance SQLite
      # or Null because web and worker processes need one provable shared view.
      - key: CONNECTOR_CACHE_BACKEND
        value: redis
      - key: JWT_SECRET
        # Recovery requires the exact original value. Store it in the external
        # secret manager and seed it before the first Blueprint sync.
        sync: false
      - key: FERNET_KEY
        # Losing this key makes stored BYOK credentials unreadable.
        sync: false
      - key: ADMIN_SECRET
        # Required to create/list hosted-alpha invitations. Keep it outside Git.
        sync: false
      - key: DELETION_TOMBSTONE_KEY
        # Current ledger-signing key; escrow independently from DB backups.
        sync: false
      - key: DELETION_TOMBSTONE_KEY_ID
        value: deletion-prod-v1
      - key: DELETION_TOMBSTONE_VERIFICATION_KEYS
        # JSON keyring of retired key-id -> secret, populated before rotation.
        sync: false
      - key: EVIDENCE_SIGNING_KEY
        # Keep this independent from JWT_SECRET and retain old verification
        # keys according to docs/OPERATIONS_RUNBOOK.md.
        sync: false
      - key: EVIDENCE_SIGNING_KEY_ID
        # Stable identifier paired with the externally managed signing key.
        sync: false
      # JSON object of retired key-id -> secret.  Populate before rotating the
      # current key; legacy JWT evidence can retain its old JWT secret here.
      - key: EVIDENCE_VERIFICATION_KEYS
        sync: false
      # Dedicated Ed25519 task-signing material for the future HTTPS science
      # worker. It is unused while SCIENCE_EXECUTION_BACKEND=celery and must
      # never be copied to control/Beat/science-worker processes.
      - key: WORKER_TASK_SIGNING_PRIVATE_KEY
        sync: false
      - key: WORKER_TASK_SIGNING_KEY_ID
        sync: false
      - key: WORKER_TASK_SIGNING_PUBLIC_KEY
        sync: false
      - key: WORKER_TASK_VERIFICATION_KEYS
        sync: false
      - key: EVIDENCE_V2_SIGNING_PRIVATE_KEY
        sync: false
      - key: EVIDENCE_V2_SIGNING_KEY_ID
        sync: false
      - key: EVIDENCE_V2_SIGNING_PUBLIC_KEY
        sync: false
      - key: EVIDENCE_V2_VERIFICATION_KEYS
        sync: false
      - key: PIPELINE_MODE
        value: celery
      - key: RATE_LIMIT_ENABLED
        value: "true"
      # Shared public inference is deliberately disabled in the reference
      # production topology. Enabling it is a separate budget/security decision
      # that also requires a verified client-IP trust mode and global cost cap.
      - key: SHARED_DEEPSEEK_API_KEY_ENABLED
        value: "false"
      # Hosted-alpha access and P1 dark-launch controls. These declarations
      # describe the target Blueprint; they do not mean it has been deployed.
      - key: SIGNUP_MODE
        value: invite_only
      - key: CLAIM_AUDIT_ENABLED
        value: "false"
      - key: RESEARCH_WORKSPACE_ENABLED
        value: "false"
      - key: ARXIV_READER_ENABLED
        value: "false"
      - key: UNION3_REPRODUCTION_ENABLED
        value: "false"
      - key: EVIDENCE_PACK_V2_ENABLED
        value: "false"
      - key: LOCAL_SCIENCE_WORKER_ENABLED
        value: "false"
      - key: CLAIM_AUDIT_EXECUTION_MODE
        value: celery
      - key: CLAIM_AUDIT_REGISTERED_TIMEOUT_SECONDS
        value: "1800"
      - key: CLAIM_AUDIT_WORKER_LEASE_SECONDS
        value: "120"
      - key: CLAIM_AUDIT_HEARTBEAT_SECONDS
        value: "30"
      - key: CLAIM_AUDIT_MAX_ACTIVE_PER_USER
        value: "2"
      - key: ARTIFACT_CLEANUP_GRACE_SECONDS
        value: "86400"
      - key: PRODUCT_ANALYTICS_RETENTION_DAYS
        value: "30"
      # Required for every production start and published at /privacy.
      # These identify the real operator; they are not a legal-compliance flag.
      - key: PRIVACY_OPERATOR_NAME
        sync: false
      - key: PRIVACY_CONTACT
        sync: false
      - key: PRIVACY_JURISDICTION
        sync: false
      - key: TRUSTED_PROXY_MODE
        # Do not trust forwarded IP headers until the target Render service has
        # passed the forged-XFF diagnostic documented in DEPLOYMENT.md.
        value: none
      # Shared research-object storage. Set bucket + credentials (and endpoint
      # for R2/MinIO) before syncing an existing Blueprint; startup fails closed
      # when required S3 credentials are absent.
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ADDRESSING_STYLE
        value: path
      - key: PERSISTENT_STORAGE_MOUNT
        value: /app/data
      - key: SANDBOX_BACKEND
        value: disabled
      - key: ASTRO_RESEARCH_FOCUS
        value: cosmology
      - key: CORS_ORIGINS
        fromService:
          name: standard-astro-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # PART AI Phase 5 #2 Track 2 — external_cobaya likelihood backend.
      # COBAYA_PACKAGES_PATH points cobaya at a writable cache for
      # likelihood data tables. It must match the directory created in
      # backend/Dockerfile (/app/cobaya_packages, owned by `app` user).
      - key: COBAYA_PACKAGES_PATH
        value: /app/cobaya_packages
      # CAMB will fork OpenMP threads otherwise; pin to 1 so a CAMB
      # call doesn't blow past container memory.
      - key: OMP_NUM_THREADS
        value: "1"
      # Master flag for the cobaya subprocess runner. Off by default.
      - key: EXTERNAL_COBAYA_ENABLED
        value: "false"
    # Research objects use shared S3-compatible storage. This single-service
    # disk preserves gate-event JSONL, local caches and portable export staging.
    disk:
      name: standard-astro-data
      mountPath: /app/data
      sizeGB: 10

  # ── Celery worker ──
  - type: worker
    name: standard-astro-celery-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    autoDeployTrigger: checksPass
    # Starter has 512 MB; one control child avoids memory overcommit. Give an
    # acknowledged late maintenance task the maximum graceful-shutdown window.
    maxShutdownDelaySeconds: 300
    # The backend owns migrations.  A worker deploy is independent on Render,
    # so it must wait for this image's exact Alembic head before consuming work.
    dockerCommand: sh -c 'python scripts/wait_for_schema_head.py && exec celery -A celery_worker worker --loglevel=info --concurrency=1 --queues=control,maintenance,verification --hostname=worker-${RENDER_GIT_COMMIT}@%h'
    envVars:
      - key: ENV
        value: production
      - key: APP_ROLE
        value: control_worker
      - key: SCIENCE_EXECUTION_BACKEND
        value: celery
      - key: DATABASE_URL
        fromDatabase:
          name: standard-astro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: standard-astro-redis
          type: keyvalue
          property: connectionString
      - key: CONNECTOR_CACHE_BACKEND
        value: redis
      - key: DELETION_TOMBSTONE_KEY
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: DELETION_TOMBSTONE_KEY
      - key: DELETION_TOMBSTONE_KEY_ID
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: DELETION_TOMBSTONE_KEY_ID
      - key: DELETION_TOMBSTONE_VERIFICATION_KEYS
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: DELETION_TOMBSTONE_VERIFICATION_KEYS
      - key: EVIDENCE_SIGNING_KEY
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: EVIDENCE_SIGNING_KEY
      - key: EVIDENCE_SIGNING_KEY_ID
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: EVIDENCE_SIGNING_KEY_ID
      - key: EVIDENCE_VERIFICATION_KEYS
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: EVIDENCE_VERIFICATION_KEYS
      - key: PIPELINE_MODE
        value: celery
      - key: CLAIM_AUDIT_ENABLED
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: CLAIM_AUDIT_ENABLED
      - key: CLAIM_AUDIT_EXECUTION_MODE
        value: celery
      - key: CLAIM_AUDIT_REGISTERED_TIMEOUT_SECONDS
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: CLAIM_AUDIT_REGISTERED_TIMEOUT_SECONDS
      - key: CLAIM_AUDIT_WORKER_LEASE_SECONDS
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: CLAIM_AUDIT_WORKER_LEASE_SECONDS
      - key: CLAIM_AUDIT_HEARTBEAT_SECONDS
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: CLAIM_AUDIT_HEARTBEAT_SECONDS
      - key: ARTIFACT_CLEANUP_GRACE_SECONDS
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: ARTIFACT_CLEANUP_GRACE_SECONDS
      - key: PRODUCT_ANALYTICS_RETENTION_DAYS
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: PRODUCT_ANALYTICS_RETENTION_DAYS
      - key: SCHEMA_WAIT_TIMEOUT_SECONDS
        value: "900"
      - key: CELERY_TASK_SOFT_TIME_LIMIT_SECONDS
        value: "43200"
      - key: CELERY_TASK_TIME_LIMIT_SECONDS
        value: "45000"
      - key: CELERY_VISIBILITY_TIMEOUT_SECONDS
        value: "46800"
      - key: RESEARCH_JOB_STALE_SECONDS
        value: "50400"
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_ENDPOINT_URL
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: S3_ENDPOINT_URL
      - key: S3_BUCKET
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: S3_BUCKET
      - key: S3_ACCESS_KEY_ID
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: S3_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: S3_SECRET_ACCESS_KEY
      - key: S3_REGION
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: S3_REGION
      - key: S3_ADDRESSING_STYLE
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: S3_ADDRESSING_STYLE
      - key: SANDBOX_BACKEND
        value: disabled
      - key: ASTRO_RESEARCH_FOCUS
        value: cosmology
      - key: COBAYA_PACKAGES_PATH
        value: /app/cobaya_packages
      - key: OMP_NUM_THREADS
        value: "1"
      - key: EXTERNAL_COBAYA_ENABLED
        value: "false"

  # ── Celery scheduler ──
  - type: worker
    name: standard-astro-celery-beat
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: starter
    autoDeployTrigger: checksPass
    # Beat must not enqueue tasks from a new image until the backend migration
    # for that same image has reached Alembic head.
    dockerCommand: sh -c 'python scripts/wait_for_schema_head.py && exec celery -A celery_worker beat --loglevel=info --pidfile=/tmp/celerybeat.pid'
    envVars:
      - key: ENV
        value: production
      - key: APP_ROLE
        value: beat
      - key: SCIENCE_EXECUTION_BACKEND
        value: celery
      - key: DATABASE_URL
        fromDatabase:
          name: standard-astro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: standard-astro-redis
          type: keyvalue
          property: connectionString
      - key: SCHEMA_WAIT_TIMEOUT_SECONDS
        value: "900"
      - key: ENABLE_TRANSIENT_ALERT_INGEST
        value: "false"

  # ── Frontend ──
  - type: web
    name: standard-astro-frontend
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: standard-astro-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NODE_VERSION
        value: "20.19.0"
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
