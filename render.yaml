databases:
  - name: standard-astro-db
    plan: free
    databaseName: astro
    user: astro

services:
  # ── Backend API ──
  - type: web
    name: standard-astro-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    # R18: /health/deep verifies DB + Redis + AI backend so Render's
    # auto-rollback catches bad deploys that would break chat even when
    # the process itself is up.
    healthCheckPath: /health/deep
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: standard-astro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: standard-astro-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PIPELINE_MODE
        value: celery
      - key: SANDBOX_BACKEND
        value: subprocess
      - key: CORS_ORIGINS
        value: https://astro-frontend-tyfr.onrender.com,https://standard-astro-frontend-tyfr.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # PART AI Phase 5 #2 Track 2 — external_cobaya likelihood backend.
      # COBAYA_PACKAGES_PATH points cobaya at a writable cache for likelihood
      # data tables. It must match the directory created in backend/Dockerfile
      # (/app/cobaya_packages, owned by the non-root `app` user).
      - key: COBAYA_PACKAGES_PATH
        value: /app/cobaya_packages
      # Free / starter dynos have limited CPU; pin OpenMP thread count so a
      # CAMB call doesn't fork worker threads that get OOM-killed.
      - key: OMP_NUM_THREADS
        value: "1"
      # Step 1 ships the dependency only — the cobaya subprocess runner
      # is shipped in step 2 and only takes effect once this flag flips on.
      - key: EXTERNAL_COBAYA_ENABLED
        value: "false"

  # ── Celery Worker ──
  - type: worker
    name: standard-astro-celery-worker
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    dockerCommand: celery -A celery_worker worker --loglevel=info --concurrency=2
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: standard-astro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: standard-astro-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: SANDBOX_BACKEND
        value: subprocess
      # PART AI Phase 5 #2 Track 2 — same cobaya env as the API container so
      # that workflow-checkpointed external_cobaya runs that resume on the
      # Celery worker share the same likelihood cache layout.
      - key: COBAYA_PACKAGES_PATH
        value: /app/cobaya_packages
      - key: OMP_NUM_THREADS
        value: "1"
      - key: EXTERNAL_COBAYA_ENABLED
        value: "false"

  # ── Celery Beat (scheduler) ──
  - type: worker
    name: standard-astro-celery-beat
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    dockerCommand: celery -A celery_worker beat --loglevel=info
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: standard-astro-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: standard-astro-redis
          type: redis
          property: connectionString

  # ── Frontend ──
  - type: web
    name: standard-astro-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://astro-backend-h4x1.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  # ── Redis ──
  - type: redis
    name: standard-astro-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
