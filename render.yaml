# ─────────────────────────────────────────────────────────────────────
# render.yaml — synced to actual Render deployment 2026-05-08.
#
# Currently deployed on Render: 3 services + 1 database.
#   - standard-astro-db (Basic-256mb)
#   - standard-astro-backend (Standard, 1 CPU / 2 GB)
#   - standard-astro-frontend (Static)
#
# NOT deployed (yaml definitions kept commented at the bottom for the
# day they're needed):
#   - standard-astro-celery-worker
#   - standard-astro-celery-beat
#   - standard-astro-redis
#
# REDIS_URL on backend is `sync: false` — set it in the Render
# dashboard if you want internal-cache via external Upstash/redis-cloud;
# leaving it unset is also fine, connector_cache auto-falls back to
# SQLite when Redis is unreachable.
#
# PIPELINE_MODE remains "celery" by code default but no worker is
# deployed; heavy pipeline DAG runs (BayesianFit / ImageStack / etc.)
# will return 503 until a Celery worker is brought up.  The cosmology
# chat path does NOT go through Celery and is unaffected.
# ─────────────────────────────────────────────────────────────────────

databases:
  - name: standard-astro-db
    plan: basic-256mb           # 1 GB storage / 256 MB RAM / 0.1 CPU
    databaseName: astro
    user: astro

services:
  # ── Backend API ──
  - type: web
    name: standard-astro-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: standard              # 2 GB RAM / 1 CPU
    # /health/deep verifies DB + AI backend so Render's auto-rollback
    # catches bad deploys that would break chat even when the process
    # itself is up.
    healthCheckPath: /health/deep
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: standard-astro-db
          property: connectionString
      # REDIS_URL: internal redis service not deployed.  Set this in
      # the Render dashboard (e.g. Upstash rediss://...) if you want
      # Redis-backed connector_cache + Celery; otherwise the auto
      # backend falls back to SQLite cache and the (currently absent)
      # Celery worker stays unused.
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PIPELINE_MODE
        value: celery
      - key: SANDBOX_BACKEND
        value: subprocess
      - key: CORS_ORIGINS
        value: https://astro-frontend-tyfr.onrender.com,https://standard-astro-frontend-tyfr.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      # PART AI Phase 5 #2 Track 2 — external_cobaya likelihood backend.
      # COBAYA_PACKAGES_PATH points cobaya at a writable cache for
      # likelihood data tables. It must match the directory created in
      # backend/Dockerfile (/app/cobaya_packages, owned by `app` user).
      - key: COBAYA_PACKAGES_PATH
        value: /app/cobaya_packages
      # CAMB will fork OpenMP threads otherwise; pin to 1 so a CAMB
      # call doesn't blow past container memory.
      - key: OMP_NUM_THREADS
        value: "1"
      # Master flag for the cobaya subprocess runner. Off by default.
      - key: EXTERNAL_COBAYA_ENABLED
        value: "false"

  # ── Frontend ──
  - type: web
    name: standard-astro-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://astro-backend-h4x1.onrender.com
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

